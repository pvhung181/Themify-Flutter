name: themify
description: "Themify using flutter"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  freezed: ^3.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/json/

  fonts:
    - family: SfCompact
      fonts:
        - asset: assets/fonts/sf_compact_rounded_regular.ttf
          weight: 400

        - asset: assets/fonts/sf_compact_rounded_medium.otf
          weight: 500

        - asset: assets/fonts/sf_compact_rounded_semibold.otf
          weight: 600