name: themify
description: "Themify using flutter"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  injectable: ^3.0.0
  shared_preferences: ^2.5.5
  auto_route: ^11.1.0
  provider: ^6.1.5+1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  build_runner: ^2.15.1
  injectable_generator: ^3.1.3
  auto_route_generator: ^10.6.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/json/

  fonts:
    - family: SfCompact
      fonts:
        - asset: assets/fonts/sf_compact_rounded_regular.ttf
          weight: 400

        - asset: assets/fonts/sf_compact_rounded_medium.otf
          weight: 500

        - asset: assets/fonts/sf_compact_rounded_semibold.otf
          weight: 600